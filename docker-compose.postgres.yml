services:
  postgres:
    image: postgres:16
    container_name: jobintel-postgres
    environment:
      POSTGRES_DB: jobintel
      POSTGRES_USER: jobintel
      POSTGRES_PASSWORD: jobintel
    ports:
      - "5432:5432"
    volumes:
      - jobintel-postgres-data:/var/lib/postgresql/data
      - ./postgres/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobintel -d jobintel"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  jobintel-postgres-data:
